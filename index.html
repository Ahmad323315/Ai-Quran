<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bano – Quran Learning Companion</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/select2-bootstrap-5-theme@1.3.0/dist/select2-bootstrap-5-theme.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Fraunces:wght@500;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<link href="assets/css/style.css" rel="stylesheet">
</head>
<body>
<header class="app-bar d-flex align-items-center justify-content-between px-3">
  <h1 class="h5 m-0 brand">Bano</h1>
  <button id="themeBtn" class="btn btn-icon" aria-label="Toggle dark mode"><i class="bi bi-moon-stars"></i></button>
</header>
<main class="container-narrow pb-5 mb-5">
  <section id="view-home" class="view"></section>
  <section id="view-quran" class="view d-none"></section>
  <section id="view-practice" class="view d-none"></section>
  <section id="view-hadith" class="view d-none"></section>
  <section id="view-profile" class="view d-none"></section>
</main>
<audio id="player" preload="none"></audio>
<nav class="bottom-nav">
  <a data-view="home"><i class="bi bi-house"></i><span>Home</span></a>
  <a data-view="quran"><i class="bi bi-book"></i><span>Quran</span></a>
  <a data-view="practice"><i class="bi bi-mic"></i><span>Practice</span></a>
  <a data-view="hadith"><i class="bi bi-chat-quote"></i><span>Hadith</span></a>
  <a data-view="profile"><i class="bi bi-person"></i><span>Profile</span></a>
</nav>
<div class="toast-wrap"><div id="toast" class="toast align-items-center text-bg-dark border-0"><div class="d-flex"><div class="toast-body"></div></div></div></div>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
<script src="assets/js/storage.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/ai-service.js"></script>
<script src="assets/js/remote-data.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
